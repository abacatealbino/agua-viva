<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Água Viva</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="overlay"></div>

  <div class="particles"></div>

  <main class="container">

    <h1>Água Viva</h1>

    <p>
      “Existem sentimentos que apenas atravessam.”
    </p>

    <button id="botao">
      mergulhar
    </button>

    <section id="mensagens" class="hidden">

      <div class="card">
        <h2>memórias</h2>

        <p>
          Algumas pessoas parecem oceano.
        </p>
      </div>

      <div class="card">
        <h2>esquinas</h2>

        <p>
          Cada esquina guarda uma história.
        </p>
      </div>

      <div class="card">
        <h2>constelação</h2>

        <p>
          Quando sentimentos viram estrelas.
        </p>
      </div>

    </section>

  </main>

  <script src="script.js"></script>

</body>

</html>
